name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Swift core + visionOS simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Swift tests
        working-directory: client
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: client
        run: xcodegen generate
      - name: Build visionOS simulator app
        working-directory: client
        run: |
          xcodebuild -project VRMC.xcodeproj -scheme VRMC -configuration Debug \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath build build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Docs checks
        run: ./scripts/check_docs.sh

  bridge-core:
    name: C++ core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure and test
        run: |
          cmake -S bridge -B build/bridge-core -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/bridge-core -j4
          ctest --test-dir build/bridge-core --output-on-failure
      - name: Protocol vectors
        run: ./scripts/test_protocol.sh

  bridge-windows:
    name: Windows host/driver compile smoke
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S bridge -B build/bridge-windows -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build/bridge-windows --config Release --parallel
      - name: Core tests
        run: ctest --test-dir build/bridge-windows -C Release --output-on-failure

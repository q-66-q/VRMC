name: VRMC
options:
  bundleIdPrefix: dev.vrmc
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEVELOPMENT_TEAM: ""
packages:
  VRMC:
    path: .
targets:
  VRMC:
    type: application
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/VRMCApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vrmc.app
        PRODUCT_NAME: VRMC
        INFOPLIST_FILE: Sources/VRMCApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "7"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_EMIT_LOC_STRINGS: "YES"
    dependencies:
      - package: VRMC
        product: VRMCore
      - package: VRMC
        product: VRMCVideo
      - sdk: CompositorServices.framework
      - sdk: ARKit.framework
      - sdk: Metal.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreVideo.framework
      - sdk: QuartzCore.framework
      - sdk: SwiftUI.framework
schemes:
  VRMC:
    build:
      targets:
        VRMC: all
    run:
      config: Debug
      environmentVariables:
        VRMC_DEMO_MODE: "0"

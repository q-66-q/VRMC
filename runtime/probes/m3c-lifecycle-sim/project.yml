name: M3CProbe
options:
  bundleIdPrefix: dev.vrmc
  deploymentTarget:
    visionOS: "27.0"
settings:
  base:
    DEVELOPMENT_TEAM: "${VRMC_TEAM_ID}"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: dev.vrmc.m3c
    TARGETED_DEVICE_FAMILY: "7"
    SWIFT_VERSION: "5.9"
targets:
  M3CProbe:
    type: application
    platform: visionOS
    sources:
      - Sources
    settings:
      base:
        INFOPLIST_KEY_NSWorldSensingUsageDescription: "VRMC M3c lifecycle probe: CompositorServices immersive test pattern."
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        OTHER_LDFLAGS: "-framework Metal -framework CompositorServices"
